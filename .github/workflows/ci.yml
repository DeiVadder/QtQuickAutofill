name: CI

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  # Compile-only: the Android and iOS backends are not part of the desktop build
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" > /dev/null
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          target: android
          arch: android_arm64_v8a
          autodesktop: true
          cache: true
      - name: Configure
        run: >
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DANDROID_SDK_ROOT="$ANDROID_HOME" -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125"
      - name: Build APK
        run: cmake --build build --target apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          target: ios
          arch: ios
          autodesktop: true
          cache: true
      - name: Configure
        run: '"$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Xcode'
      - name: Build
        run: cmake --build build --config Debug -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO -quiet
